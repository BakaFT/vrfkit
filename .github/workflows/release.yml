name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v0.4.0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # This single-use, exact-commit bootstrap is required because GitHub's
  # GITHUB_TOKEN tag pushes do not themselves trigger another push workflow.
  # The explicit workflow_dispatch below DOES trigger the verified release.
  bootstrap-v040:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v0.4.0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tag exact main commit and start verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.4.0"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          workspace = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]
          assert workspace["version"] == "0.4.0", workspace["version"]
          packages = tomllib.loads(Path("Cargo.lock").read_text())["package"]
          runtime = [p for p in packages if p["name"].startswith("vrf-") or p["name"] == "vrfkit"]
          assert len(runtime) == 10, len(runtime)
          assert all(p["version"] == "0.4.0" for p in runtime)
          PY
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo "Refusing release: branch does not point to current main."
            exit 1
          fi
          existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          elif [[ "$existing" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: existing tag points at a different commit."
            exit 1
          fi
          if gh api "repos/$GH_REPO/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release already exists; nothing to republish."
            exit 0
          fi
          gh api -X POST "repos/$GH_REPO/actions/workflows/release.yml/dispatches" -f ref="$tag" >/dev/null
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Verify tagged commit
    uses: ./.github/workflows/ci.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish verified Windows release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release-dist
      - name: verify the assets and publish without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -W error tools/package_release.py verify --directory release-dist --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          archive="release-dist/vrfkit-$RELEASE_TAG-windows-x64.zip"
          flags=()
          version="${RELEASE_TAG%%+*}"
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
